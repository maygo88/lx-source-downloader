name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

# Read-only by default; only the release job (below) is allowed to write.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        shell: pwsh
        run: ./build.ps1

      - name: Smoke test (headless)
        shell: pwsh
        run: ./tests/smoke.ps1 -SkipGui

      - name: Check the tag matches the assembly version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          # Passed through env instead of being interpolated into the script text.
          $tag = $env:TAG_NAME.Trim()
          $exe = 'dist/LxSourceDownloader.exe'
          $fileVersion = (Get-Item $exe).VersionInfo.FileVersion   # e.g. 1.2.1.0
          $expected = $tag.TrimStart('v')
          Write-Host "tag=$tag exe=$fileVersion"
          if (-not $fileVersion.StartsWith($expected + '.')) {
            throw "Tag $tag does not match src/AssemblyInfo.cs (exe version $fileVersion). Bump the version before tagging."
          }

      - name: Package
        shell: pwsh
        run: |
          $dist = 'dist'
          Copy-Item README.md, README.zh-CN.md, LICENSE -Destination $dist
          Copy-Item CHANGELOG.md -Destination $dist
          New-Item -ItemType Directory -Force -Path "$dist/docs" | Out-Null
          Copy-Item docs/screenshot.png -Destination "$dist/docs"
          Compress-Archive -Path "$dist/*" -DestinationPath LxSourceDownloader-win-x64.zip -Force
          Get-ChildItem . -Filter *.zip | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LxSourceDownloader-win-x64
          path: LxSourceDownloader-win-x64.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the packaged zip
        uses: actions/download-artifact@v4
        with:
          name: LxSourceDownloader-win-x64
          path: .

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: LxSourceDownloader-win-x64.zip
          generate_release_notes: true
